plugins {
    id 'java'
    id 'multiloader-common'
    id 'net.neoforged.moddev'
    id "me.champeau.jmh" version "0.7.3"
}

neoForge {
    neoFormVersion = neo_form_version
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    compileOnly("net.fabricmc:sponge-mixin:0.17.0+mixin.0.8.7")
    compileOnly("org.ow2.asm:asm-tree:9.9.1")
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly("io.github.llamalad7:mixinextras-common:0.5.3")
    annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3")

    implementation("one.pkg.velocity_rc:velocity-native:${recast_version}") {
        exclude group: 'io.netty'
    }

    compileOnly("org.yaml:snakeyaml:2.4")
    implementation("one.pkg:sewlia-config:${config_api_version}") {
        exclude group: 'org.slf4j'
    }

    testImplementation(platform("org.junit:junit-bom:6.0.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testImplementation("io.netty:netty-buffer:4.2.7.Final")
    testImplementation("io.netty:netty-codec:4.2.7.Final")
    testImplementation("io.netty:netty-handler:4.2.7.Final")
    testImplementation("org.slf4j:slf4j-simple:1.7.36")

    jmh("io.netty:netty-buffer:4.2.7.Final")
    jmh("io.netty:netty-common:4.2.7.Final")
    jmh("io.netty:netty-codec:4.2.7.Final")
    jmh("io.netty:netty-handler:4.2.7.Final")
    jmh("io.netty:netty-resolver:4.2.7.Final")
    jmh("one.pkg.velocity_rc:velocity-native:3.4.0-SNAPSHOT") {
        exclude group: 'io.netty'
    }
    jmh("org.openjdk.jmh:jmh-core:1.37")
    jmh("org.openjdk.jmh:jmh-generator-annprocess:1.37")
    jmh("org.openjdk.jmh:jmh-generator-bytecode:1.37")
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

jmh {
    resultFormat = "JSON"
    zip64 = true
}

test {
    useJUnitPlatform()
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

jmh {
    if (project.hasProperty('jmh.includes')) {
        includes = [project.property('jmh.includes')]
    }
}
