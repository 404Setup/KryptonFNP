authors = "${mod_author}"
description = '''${description}'''

[[dependencies."${mod_id}_addons_quic"]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}_addons_quic"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}_addons_quic"]]
modId = "kreno"
type = "required"
versionRange = "[${version},)"
ordering = "BEFORE"
side = "BOTH"