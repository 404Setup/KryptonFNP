modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL = "${issues_url}"

[[mods]]
modId = "${mod_id}_addons_quic"
version = "${version}"
displayName = "${mod_name}"
updateJSONURL = "https://mvnc.pkg.one/update/mod/kreno_addons_quic/forge_update.json"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/kreno_addons_quic"
logoFile = "assets/${mod_id}/icon.png"
